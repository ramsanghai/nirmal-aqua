# n8n + WAHA on one network. Start with:  docker compose up -d
# n8n  -> http://localhost:5678   (first visit: create the owner account; basic auth was removed in n8n 1.x)
# WAHA -> http://localhost:3000   (dashboard + Swagger; scan the QR for the secondary number)
# From inside n8n, WAHA is reachable at http://waha:3000

name: nirmal-aqua-automation

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # pin to a tested version for production
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      TZ: ${TIMEZONE:-Asia/Kolkata}
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:5678/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # The workflow reads secrets with $env.X, so env access inside nodes must be allowed.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- passthrough from .env (used by $env.* in the workflow) ---
      BRAND_NAME: ${BRAND_NAME:-Nirmal Aqua}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_IMAGE_URL: ${HF_IMAGE_URL:-https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell}
      IMGBB_API_KEY: ${IMGBB_API_KEY:-}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - nirmal-net
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha:latest   # on ARM (Raspberry Pi / some Macs) use devlikeapro/waha:arm
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-change-me-long-random}
      WAHA_API_KEY: ${WHATSAPP_API_KEY:-change-me-long-random}   # newer WAHA name for the same key
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-change-me}
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - nirmal-net

volumes:
  n8n_data:
  waha_sessions:

networks:
  nirmal-net:
    driver: bridge
